name: Scrape Amazon Best Sellers

on:
  # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC).
  schedule:
    - cron: "0 */6 * * *"
  # Manual trigger from the Actions tab.
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated category slugs (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

# If a run is already going, let it finish rather than piling up.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ONLY_CATEGORIES: ${{ github.event.inputs.only }}
        run: python scrape.py

      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update best sellers — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
